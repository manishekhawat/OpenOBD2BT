// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// obd-scout: enable BuildConfig for library modules
// react-native-bluetooth-classic imports BuildConfig, which AGP no longer
// generates for libraries unless asked. AGP 9 removed the global property for
// this, so it has to be set per module.
subprojects { subproject ->
    subproject.afterEvaluate {
        def androidExtension = subproject.extensions.findByName("android")
        if (androidExtension != null) {
            androidExtension.buildFeatures.buildConfig = true
        }
    }
}
