name: Build APK

# Builds a sideloadable release APK on a GitHub runner, which ships with the
# Android SDK preinstalled. Run it from the Actions tab, or let it run on a push
# to main. The finished APK is attached to the run as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --ci

      # android/ is committed, so prebuild only runs if it is somehow absent.
      - name: Generate the native project if needed
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Build the release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK by version and commit
        id: rename
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="obd-scout-${VERSION}-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: obd-scout-apk
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error
          retention-days: 30
