name: Build APK

# Builds a sideloadable release APK on a GitHub runner, which ships with the
# Android SDK preinstalled. Run it from the Actions tab, or let it run on a push
# to main. The finished APK is attached to the run as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The package list has to be given explicitly: the action's own default
      # includes the obsolete 'tools' package, which no longer exists in the
      # repository and makes sdkmanager exit 1. Only platform-tools is pinned
      # here because it always exists; the platform itself is resolved below
      # against what the repository actually offers.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Expo 58 requires compiling against API 37, but the exact package name
      # depends on whether that API is final or still a preview codename. Ask
      # the repository rather than guessing, install the newest platform it has,
      # and report what was available so a mismatch is visible in the log.
      - name: Resolve and install the newest Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "Using $SDKMANAGER"

          # Expo 58 needs API 37, which the stable channel does not carry.
          # Channel 3 includes canary, beta and dev as well as stable, so this
          # finds a preview platform if that is where 37 lives.
          echo "--- platforms on the stable channel ---"
          "$SDKMANAGER" --list 2>/dev/null | grep -oE 'platforms;android-[A-Za-z0-9.]+' | sort -u | tee /tmp/stable.txt | tail -4

          echo "--- platforms across all channels (canary included) ---"
          "$SDKMANAGER" --list --channel=3 2>/dev/null | grep -oE 'platforms;android-[A-Za-z0-9.]+' | sort -u | tee /tmp/all.txt | tail -8

          # Android now publishes minor API levels, so API 37 is packaged as
          # android-37.0, android-37.1 and so on rather than a bare android-37.
          # Every 37.x is installed, because which minor AGP resolves to depends
          # on the compileSdkMinor it defaults to.
          API37=$(grep -E 'platforms;android-37(\.[0-9]+)?$' /tmp/all.txt || true)

          if [ -n "$API37" ]; then
            echo "Found API 37 on the preview channel:"
            echo "$API37"
            for package in $API37; do
              echo "Installing $package"
              yes | "$SDKMANAGER" --channel=3 "$package" 2>&1 | tail -2 || true
            done
            LEVEL=37
          else
            TARGET=$(grep -E 'platforms;android-[0-9]+(\.[0-9]+)?$' /tmp/all.txt | sort -V | tail -1)
            echo "API 37 is not published on any channel; falling back to $TARGET"
            yes | "$SDKMANAGER" "$TARGET" 2>&1 | tail -2 || true
            LEVEL=$(echo "$TARGET" | grep -oE '[0-9]+' | tail -1)
          fi

          echo "ANDROID_COMPILE_SDK=$LEVEL" >> "$GITHUB_ENV"
          echo "Resolved compile SDK: $LEVEL"
          ls "$ANDROID_HOME/platforms" || true

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --ci

      # android/ is committed, so prebuild only runs if it is somehow absent.
      - name: Generate the native project if needed
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Build the release APK
        run: |
          chmod +x android/gradlew
          cd android
          # Compile against whatever platform was actually installed, rather
          # than the level baked into gradle.properties at prebuild time.
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.compileSdkVersion="${ANDROID_COMPILE_SDK}"

      - name: Name the APK by version and commit
        id: rename
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="obd-scout-${VERSION}-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: obd-scout-apk
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error
          retention-days: 30
